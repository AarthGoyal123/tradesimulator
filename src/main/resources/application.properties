# Disable Spring Boot's auto-configured DataSource since we manage SQLite manually
spring.datasource.url=jdbc:sqlite:tradesim.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# Disable HikariCP since we don't use Spring's DataSource
spring.datasource.hikari.enabled=false

# Use different port to avoid conflicts
server.port=8081